<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>CSS Tables Style</title>
  </head>
  <body>
    <!-- h1+table>(thead>tr>th*4)+(tbody>tr>td*4) -->
    <h1>Product List</h1>
    <table>
      <!-- Header of the table -->
      <thead>
        <tr>
          <th>No</th>
          <th>Product</th>
          <th>Category</th>
          <th>Price</th>
        </tr>
      </thead>

      <!-- Body of the table -->
      <tbody>
        <tr>
          <td>1</td>
          <td>Keyboard</td>
          <td>Accessories</td>
          <td>$25</td>
        </tr>
        <tr>
          <td>2</td>
          <td>Mouse</td>
          <td>Accessories</td>
          <td>$12</td>
        </tr>
        <tr>
          <td>3</td>
          <td>Monitor</td>
          <td>Display</td>
          <td>$180</td>
        </tr>
        <tr>
          <td>4</td>
          <td>USB</td>
          <td>Accessories</td>
          <td>$8</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
