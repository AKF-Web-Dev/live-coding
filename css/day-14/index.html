<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>List style in css</title>
  </head>
  <body>
    <!-- (ul>li*4)+ol>li*4 -->

    <h5>Unordered List</h5>
    <ul>
      <li>Rice</li>
      <li>Steak</li>
      <li>Pizza</li>
      <li>Burger</li>
    </ul>

    <h5>Ordered List</h5>
    <ol>
      <li>HTML</li>
      <li>CSS</li>
      <li>JavaScript</li>
      <li>Express.Js</li>
    </ol>
  </body>
</html>
