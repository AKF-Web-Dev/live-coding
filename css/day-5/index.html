<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>none, inhret, auto in css</title>

    <style>
      body {
        /* display: flex;
        justify-content: center;
        align-items: center; */
        height: 100vh;
        width: 100vw;
      }

      section {
        height: 60%;
        width: 60%;

        margin: 0 auto;
        /* display: flex;
        justify-content: center;
        align-items: center; */
      }

      .container {
        /* display: flex;
        justify-content: center;

      }

        /* display: flex;

        background-color: white;

      h1 {

      }

    <section>
