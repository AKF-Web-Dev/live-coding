<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Box Shadow in CSS</title>

    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      main {
        height: 60%;
        width: 80%;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 50px;
        border: 2px double black;
      }

      div {
        height: 250px;
        width: 250px;
        background-color: orangered;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 2rem;
        color: white;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="right">Right</div>
      <div class="left">Left</div>
      <div class="bottom">Bottom</div>
      <div class="top">Top</div>
    </main>
  </body>
</html>
