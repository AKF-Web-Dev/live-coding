<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Box Shadow in CSS</title>

    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      main {
        height: 60%;
        width: 80%;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 70px;
        border: 2px double black;
      }

      div {
        height: 250px;
        width: 250px;
        background-color: orangered;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 2rem;
        color: white;
        border-radius: 30px;
      }

      .box-1 {
        box-shadow: inset 10px 10px 20px 5px rgba(0, 0, 0, 0.25);
      }

      .box-2 {
        box-shadow: 10px 10px 20px 5px rgba(0, 0, 0, 0.25);
      }

      .box-3 {
        box-shadow:
          inset 10px 10px 20px 6px rgba(0, 0, 0, 0.212),
          10px 10px 20px 6px rgba(0, 0, 0, 0.489);
      }

      .box-4 {
        box-shadow:
          0px 0px 0px 10px black,
          0px 0px 0px 20px green,
          0px 0px 0px 30px red;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="box-1">Box 1</div>
      <div class="box-2">Box 2</div>
      <div class="box-3">Box 3</div>
      <div class="box-4">Box 4</div>
    </main>
  </body>
</html>
